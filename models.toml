smoke_shape = [1, 2, 192, 192]
range = "[0, 1]: softmax over background (channel 0) and person (channel 1); the matte is channel 1"

[[models]]
id = "pphumanseg-v2-lite"
file = "pp_humansegv2_lite_192x192.onnx"
size = 12205830
sha256 = "ca96b4436f1ce6a76059e8902e20a9617f6829fb11f6c6c9e876563e6352e6b4"
kind = "paddle"
input_file = "human_pp_humansegv2_lite_192x192_inference_model_with_softmax.zip"
input_urls = [
    "https://paddleseg.bj.bcebos.com/dygraph/pp_humanseg_v2/human_pp_humansegv2_lite_192x192_inference_model_with_softmax.zip",
]
input_sha256 = "9d86bc9c86c282cc2e92eaa089b96e18d30776c6ca745be18e6251a4e2a00110"
paddle_model_dir = "human_pp_humansegv2_lite_192x192_inference_model_with_softmax"
# paddle2onnx is asked for opset 13 (as for mobile) and raises it to 14 itself:
# the hard_swish operator of this model needs it.
opset = 14
licence = "Apache-2.0"
licence_url = "https://github.com/PaddlePaddle/PaddleSeg/blob/release/2.9/LICENSE"
project_url = "https://github.com/PaddlePaddle/PaddleSeg/tree/release/2.9/contrib/PP-HumanSeg"
model_card_url = "https://github.com/PaddlePaddle/PaddleSeg/blob/release/2.9/contrib/PP-HumanSeg/README.md"
training_data = "UNCONFIRMED: trained on PP-HumanSeg14K among other data; PP-HumanSeg14K is available only on request from Baidu (paddleseg@baidu.com), with no licence stated publicly."
conversion = "convert/pp_static.py re-saves the Paddle inference model with the input shape fixed at 1x3x192x192, then paddle2onnx, asked for opset 13, exports at opset 14 (its hard_swish operator needs it); convert/pp_fix_pool.py resolves an adaptive AveragePool (kernel -1) when paddle2onnx leaves one; the weights are unchanged."
preprocessing = "RGB, (v / 255 - 0.5) / 0.5 (values in [-1, 1]), NCHW, squashed to 192x192 (the aspect ratio is not kept)."

[models.input]
name = "x"
shape = [1, 3, 192, 192]
value_range = [-1.0, 1.0]

[models.output]
name = "save_infer_model/scale_0.tmp_0"
shape = [1, 2, "height", "width"]
smoke_shape = [1, 2, 192, 192]
range = "[0, 1]: softmax over background (channel 0) and person (channel 1); the matte is channel 1"

[[models]]
id = "modnet"
file = "modnet_photographic.onnx"
size = 25888640
sha256 = "07c308cf0fc7e6e8b2065a12ed7fc07e1de8febb7dc7839d7b7f15dd66584df9"
kind = "copy"
# The upstream export declares opset 11.
opset = 11
input_file = "modnet.onnx"
# Primary: the official ONNX export linked from the MODNet repository
# (onnx/README.md, Google Drive file 1cgycTQlYXpTh26gB9FTnthE7AvruV8hd).
# Mirror: the byte-identical Hugging Face copy, pinned to a commit.
input_urls = [
    "https://drive.usercontent.google.com/download?id=1cgycTQlYXpTh26gB9FTnthE7AvruV8hd&export=download&confirm=t",
    "https://huggingface.co/Xenova/modnet/resolve/fa2fa546052fba4c08921230a26cc69a333fca12/onnx/model.onnx",
]
input_sha256 = "07c308cf0fc7e6e8b2065a12ed7fc07e1de8febb7dc7839d7b7f15dd66584df9"
licence = "Apache-2.0"
licence_url = "https://github.com/ZHKKKe/MODNet#license"
project_url = "https://github.com/ZHKKKe/MODNet"
model_card_url = "https://github.com/ZHKKKe/MODNet/blob/master/onnx/README.md"
training_data = "UNCONFIRMED: not named in the repository's README (the paper describes it); its terms are not confirmed."
conversion = "None: the upstream ONNX export (Image Matting Model, photographic), unmodified."
preprocessing = "RGB, values in [-1, 1], NCHW; scale so the short side is 288 and round both sides to a multiple of 32 (288x512 for 16:9)."

[models.input]
name = "input"
shape = ["batch_size", 3, "height", "width"]
value_range = [-1.0, 1.0]
smoke_shape = [1, 3, 288, 512]

[models.output]
name = "output"
shape = ["batch_size", 1, "height", "width"]
smoke_shape = [1, 1, 288, 512]
range = "[0, 1]: the alpha matte"
