# The model table: the single source of truth for scripts/build-models.sh,
# the manifest it writes (dist/MANIFEST.toml) and the tests.
#
# Per model:
#   id              short identifier; also the directory under licenses/
#   file            the release file name (consumers download it by this name)
#   size            the expected size of the release file, in bytes
#   sha256          the expected SHA-256 of the release file
#   kind            the pipeline that makes it: tflite, paddle or copy
#   input_file      the upstream file name, as downloaded
#   input_urls      the upstream locations, tried in order (first = primary)
#   input_sha256    the SHA-256 of the upstream file; checked before any use
#   paddle_model_dir  (paddle) the directory inside the upstream archive
#   tf2onnx_opset   (tflite) the ONNX opset tf2onnx converts to
#   opset           the opset of the default ONNX domain (ai.onnx) the
#                   release file declares; convert/verify_model.py checks it
#   reproducible    optional, true by default: the conversion gives the same
#                   bytes on every run, and the build checks the result's
#                   sha256 against the table. false: it does not (the bytes
#                   change between runs, the content does not), and the
#                   build ships a supplied reference file whose sha256 is the
#                   table's, after proving a fresh conversion equivalent to
#                   it (scripts/lib/equivalence.py; docs/release.md)
#   equivalence_tolerance  (reproducible = false) the largest absolute
#                   difference allowed between the outputs of the reference
#                   and of the fresh conversion on the probe inputs
#   licence         SPDX identifier of the model's licence
#   licence_url     the upstream licence (evidence)
#   project_url     the upstream project
#   model_card_url  the model card or the page that describes the model
#   training_data   what is known about the training data's terms
#   conversion      a one-line summary of how the file is made
#   preprocessing   what the model expects as input
#   [models.input]  name; shape, as the file declares it (a string is a
#                   dynamic dimension); value_range, the range of the
#                   preprocessed values; smoke_shape, the shape of the smoke
#                   inference, when shape has a dynamic dimension
#   [models.output] name; shape, as declared; smoke_shape, the shape the
#                   smoke inference must produce, when shape has a dynamic
#                   dimension; range, what the values mean

schema = 1

[[models]]
id = "mediapipe-landscape"
file = "selfie_segmentation_landscape.onnx"
size = 449893
sha256 = "fa02222275c455638fa1190493b659d25ad31e86f1b6459f17bd501f02cbe43d"
kind = "tflite"
# The reference file declares opset 17; HardSwish needs opset 14 or newer.
tf2onnx_opset = 17
opset = 17
# tf2onnx 1.17.0 names its folded constants differently on every run (and
# sometimes adds one Reshape to the same shape), so no two runs give the same
# bytes. The release file is the reference conversion below; each build
# checks a fresh conversion against it. The outputs are in [0, 1]; 1e-6 is
# about 8 float32 steps at 1.0: room for a different summation order, far
# below any change of a weight or an operator.
reproducible = false
equivalence_tolerance = 1e-6
input_file = "selfie_segmentation_landscape.tflite"
input_urls = [
    "https://storage.googleapis.com/mediapipe-assets/selfie_segmentation_landscape.tflite",
]
input_sha256 = "a77d03f4659b9f6b6c1f5106947bf40e99d7655094b6527f214ea7d451106edd"
licence = "Apache-2.0"
licence_url = "https://github.com/google-ai-edge/mediapipe/blob/master/LICENSE"
project_url = "https://github.com/google-ai-edge/mediapipe"
model_card_url = "https://storage.googleapis.com/mediapipe-assets/Model%20Card%20MediaPipe%20Selfie%20Segmentation.pdf"
training_data = "Described in the model card (Google's own data set); no further terms stated."
conversion = "tf2onnx --tflite at opset 17, then convert/fix_tconv.py replaces the TFLite custom operator Convolution2DTransposeBias with standard ONNX Transpose + ConvTranspose (stride 2) + Transpose; the weights are unchanged."
preprocessing = "RGB, values in [0, 1], NHWC, resized to 144x256 (height x width)."

[models.input]
name = "input_1"
shape = [1, 144, 256, 3]
value_range = [0.0, 1.0]

[models.output]
name = "segment_back"
shape = [1, 144, 256, 1]
range = "[0, 1]: the person's alpha"

[[models]]
