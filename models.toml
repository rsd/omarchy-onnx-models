conversion = "convert/pp_static.py re-saves the Paddle inference model with the input shape fixed at 1x3x192x192, then paddle2onnx at opset 13; convert/pp_fix_pool.py resolves an adaptive AveragePool (kernel -1) when paddle2onnx leaves one; the weights are unchanged."
